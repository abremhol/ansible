- name: Install .NET SDK via mise
  shell: ~/.local/bin/mise use --global dotnet@latest
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  tags:
  - install
  - dotnet
  - dotnet-tools

- name: Install gnupg and ca-certificates
  become: true
  apt:
    name: ["gnupg", "ca-certificates"]
    update_cache: yes
  tags:
    - install
    - mono

- name: Install artifact credential provider
  shell: sh -c "$(curl -fsSL https://aka.ms/install-artifacts-credprovider.sh)"
  tags:
  - install
  - dotnet
  - nuget

- name: Install EasyDotnet
  shell: ~/.local/bin/mise exec -- dotnet tool install --global EasyDotnet
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    executable: /bin/bash
  tags:
  - install
  - dotnet
  - nuget

- name: Install dotnet outdated tool
  shell: ~/.local/bin/mise exec -- dotnet tool install --global dotnet-outdated-tool
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    executable: /bin/bash
  tags:
  - install
  - dotnet
  - nuget

- name: Install dotnet ef tool
  shell: ~/.local/bin/mise exec -- dotnet tool install --global dotnet-ef
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    executable: /bin/bash
  tags:
  - install
  - dotnet
  - nuget

- name: Install csharpier
  shell: ~/.local/bin/mise exec -- dotnet tool install --global csharpier
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    executable: /bin/bash
  tags:
  - install
  - dotnet
  - nuget
